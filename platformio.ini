; PlatformIO Project Configuration File
;
; TC (Test Controller) Firmware - FW-1 for multiple platforms
; Phases 1-5: HAL/BSP, Hardware, Recipes, DUT Interface, ESP32 Port
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-Devkit
test_dir = test

[platformio:home]
; Configuration for home/local builds
build_cache_dir = .pio/build_cache

[env:esp32-Devkit]
; ESP32-DevKit (default platform for TC)
; Phase 5: Full ESP32 port with HAL implementations
board = freenove_esp32_s3_wroom_n16r8
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:scripts/gen_version.py
; Build configuration
; lib_extra_dirs: treat project subdirectories as libraries for ESP32 build.
; lib_dir is NOT set globally (removed) to prevent native env from picking up
; src/ and Unity/examples/ as spurious libraries.
lib_extra_dirs = .
build_flags =
    -DESP32_DEVKIT
    -DTARGET_ESP32
    -DSWD_FAST_GPIO
    -std=gnu11
    -Wall
    -Wextra
    ; Note: WDT settings are configured via sdkconfig.esp32-Devkit (Kconfig), not -D flags
    ; Linker wrap: intercept _write_r to tee stdout to TCP console client
    -Wl,--wrap=_write_r
    ; common/ submodule include paths (tc-firmware-common)
    -Icommon/include
    -Icommon/hal
    -Icommon/src
    -Icommon/storage

; Include paths for HAL headers
build_unflags = -std=gnu++11

; Partition table with OTA + LittleFS recipe storage
board_build.partitions = partitions_ota.csv

; Output configuration
board_build.embed_txtfiles =
board_build.filesystem = spiffs

; Test configuration
test_framework = unity
test_speed = 115200
test_build_src = yes
test_filter = test_*

[env:esp32-Devkit-Debug]
; Debug variant with verbose logging
extends = env:esp32-Devkit
build_flags =
    -DESP32_DEVKIT
    -DTARGET_ESP32
    -DSWD_FAST_GPIO
    -std=gnu11
    -Wall
    -Wextra
    -Wl,--wrap=_write_r
    -Icommon/include
    -Icommon/hal
    -Icommon/src
    -Icommon/storage
    -DDEBUG=1
    -O0

[env:uno_r4_wifi]
; Arduino Uno R4 WiFi (alternative platform)
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -DUNO_R4_WIFI
    -std=gnu11
    -Wall
    -Wextra

[env:native]
; Native Linux environment for CI/CD testing with mocks
; Uses mock HAL implementations in common/hal/mock/ (tc-firmware-common submodule)
platform = native
test_framework = unity
; test_build_src intentionally NOT set (defaults to no):
; src/ contains ESP32-specific files (nvs_flash, driver/gpio, etc.) that cannot compile on native.
; Test files include the sources they need directly (mocks, app/, hal/, etc.).
; lib_extra_dirs: project subdirectory libraries available for native tests.
; src/ is excluded (ESP32-specific; not compiled on native).
; hal/ is excluded — tests include HAL mock .c files directly; adding hal/ here causes
;   libmock.a to be built with ALL mock variants (esp32+plain), causing duplicate symbols.
; common/src/ is excluded (ESP32-specific cmd_*.c files).
lib_extra_dirs =
    app
    bsp
    dut
    recipes
    storage
; lib_ldf_mode=chain: scan headers #include-d by source files plus project's own libs.
; Do NOT use chain+ — that deep-scans Unity's own dependencies, pulling in Unity/examples/
; which reference ProductionCode.h that doesn't exist in this project.
lib_ldf_mode = chain
build_flags =
    -DDEBUG=1
    -DNATIVE_BUILD
    ; Use C++11 — project headers use C++ struct syntax (default member initializers)
    -std=gnu++11
    -Wall
    -Wextra
    ; Unity test framework headers (lib_dir=lib prevents auto-scanning Unity/examples/)
    -I.pio/libdeps/native/Unity/src
    ; common/ submodule include paths (tc-firmware-common)
    -Icommon/include
    -Icommon/hal
    -Icommon/src
    -Icommon/storage
; Only run tests that work with mocks (skip hardware-specific tests if any)
test_filter = test_*
