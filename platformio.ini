; PlatformIO Project Configuration File
;
; TC (Test Controller) Firmware - FW-1 for multiple platforms
; Phases 1-5: HAL/BSP, Hardware, Recipes, DUT Interface, ESP32 Port
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-Devkit
test_dir = test
lib_dir = .

[platformio:home]
; Configuration for home/local builds
build_cache_dir = .pio/build_cache

[env:esp32-Devkit]
; ESP32-DevKit (default platform for TC)
; Phase 5: Full ESP32 port with HAL implementations
board = freenove_esp32_s3_wroom_n16r8
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:scripts/gen_version.py

; Build configuration
build_flags =
    -DESP32_DEVKIT
    -DTARGET_ESP32
    -std=gnu11
    -Wall
    -Wextra
    ; Note: WDT settings are configured via sdkconfig.esp32-Devkit (Kconfig), not -D flags
    ; Linker wrap: intercept _write_r to tee stdout to TCP console client
    -Wl,--wrap=_write_r
    ; common/ submodule include path (tc-firmware-common board-level headers)
    -Icommon/include

; Include paths for HAL headers
build_unflags = -std=gnu++11

; Partition table with OTA slots (factory + ota_0 + ota_1 + dut_fw + prod_fw)
; dut_fw/prod_fw are 896 KB each — fits in 8 MB physical flash.
board_build.partitions = partitions_ota.csv

; Output configuration
board_build.embed_txtfiles =
board_build.filesystem = fatfs

; Test configuration
test_framework = unity
test_speed = 115200
test_build_src = yes
test_filter = test_*

[env:esp32-Devkit-Debug]
; Debug variant with verbose logging
extends = env:esp32-Devkit
build_flags =
    -DESP32_DEVKIT
    -DTARGET_ESP32
    -std=gnu11
    -Wall
    -Wextra
    -DDEBUG=1
    -O0

[env:uno_r4_wifi]
; Arduino Uno R4 WiFi (alternative platform)
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -DUNO_R4_WIFI
    -std=gnu11
    -Wall
    -Wextra

[env:native]
; Native Linux environment for CI/CD testing with mocks
; Uses mock HAL implementations in hal/mock/
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -DDEBUG=1
    -DNATIVE_BUILD
    -std=gnu11
    -Wall
    -Wextra
; Only run tests that work with mocks (skip hardware-specific tests if any)
test_filter = test_*
