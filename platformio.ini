; PlatformIO Project Configuration File
;
; TC (Test Controller) Firmware - FW-1 for multiple platforms
; Phases 1-5: HAL/BSP, Hardware, Recipes, DUT Interface, ESP32 Port
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-Devkit
test_dir = test
lib_dir = .

[platformio:home]
; Configuration for home/local builds
build_cache_dir = .pio/build_cache

[env:esp32-Devkit]
; ESP32-DevKit (default platform for TC)
; Phase 5: Full ESP32 port with HAL implementations
board = freenove_esp32_s3_wroom
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_speed = 460800

; Build configuration
build_flags =
    -DESP32_DEVKIT
    -DTARGET_ESP32
    -std=gnu11
    -Wall
    -Wextra
    ; Safety: Watchdog timers (bricking prevention)
    -DCONFIG_ESP_TASK_WDT=1
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
    -DCONFIG_BOOTLOADER_WDT_ENABLE=1
    -DCONFIG_ESP_INT_WDT=1
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=300

; Include paths for HAL headers
build_unflags = -std=gnu++11

; Output configuration
board_build.embed_txtfiles =
board_build.filesystem = fatfs

; Test configuration
test_framework = unity
test_speed = 115200
test_build_src = yes
test_filter = test_*

[env:esp32-Devkit-Debug]
; Debug variant with verbose logging
extends = env:esp32-Devkit
build_flags =
    -DESP32_DEVKIT
    -DTARGET_ESP32
    -std=gnu11
    -Wall
    -Wextra
    -DDEBUG=1
    -O0

[env:uno_r4_wifi]
; Arduino Uno R4 WiFi (alternative platform)
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -DUNO_R4_WIFI
    -std=gnu11
    -Wall
    -Wextra

[env:native]
; Native Linux environment for CI/CD testing with mocks
; Uses mock HAL implementations in hal/mock/
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -DDEBUG=1
    -DNATIVE_BUILD
    -std=gnu11
    -Wall
    -Wextra
; Only run tests that work with mocks (skip hardware-specific tests if any)
test_filter = test_*
