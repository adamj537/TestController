#
# AI Agent Context Ignore Policy: Embedded Firmware (ESP32/PlatformIO)
#
# Excludes generated build artifacts, dependencies, and temporary files 
# specific to the embedded toolchain (e.g., PlatformIO or ESP-IDF).
#
- path: .pio/
  reason: PlatformIO build directory and cache (contains binaries, objects, logs).
- path: build/
  reason: Common build output directory for ESP-IDF or other C/C++ build systems.
- path: **/*.o
  reason: Compiled object files.
- path: **/*.map
  reason: Linker map files.
- path: **/*.elf
  reason: Executable firmware files.
- path: **/*.bin
  reason: Binary firmware images.
- path: **/*.hex
  reason: Intel HEX files (another common firmware format).
- path: **/*.d
  reason: Dependency files generated by the compiler.
- path: **/*.s
  reason: Intermediate assembly files.
- path: **/*.lst
  reason: Listing files.
- path: **/CMakeCache.txt
  reason: CMake generated configuration file.
- path: **/CMakeFiles/
  reason: CMake internal temporary files.
- path: **/*.ninja
  reason: Ninja build system files.
- path: **/.vscode/
  reason: VSCode workspace/cache files.