name: FW-1 TC Firmware Unit Tests

on:
  push:
    branches: [ main, 'feat/**', 'feature/**' ]
    paths:
      - 'src/**'
      - 'common'
      - 'common/**'
      - 'hal/**'
      - 'bsp/**'
      - 'app/**'
      - 'storage/**'
      - 'recipes/**'
      - 'dut/**'
      - 'test/**'
      - 'platformio.ini'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  native-tests:
    name: Native unit tests (pio test)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      # No submodules: native tests include source files directly and
      # do not depend on the common/ submodule (ESP32-specific, excluded from native build)

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Run native test suite
      working-directory: .
      run: pio test -e native -v 2>&1 | tee test_results.txt

    - name: Check test results
      working-directory: .
      run: |
        if grep -q "FAILED\|ERRORED" test_results.txt; then
          echo "One or more tests failed:"
          grep -E "FAILED|ERRORED|\[FAIL\]" test_results.txt
          exit 1
        fi
        echo "All tests passed:"
        grep "succeeded" test_results.txt || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-test-results
        path: test_results.txt
